name: Backup diário das notas

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/backup.py
      - name: Grava se mudou
        run: |
          git config user.name "discoteca-bot"
          git config user.email "discoteca-bot@users.noreply.github.com"
          git add backup
          git diff --cached --quiet || (git commit -m "Backup diário das notas" && git push)
